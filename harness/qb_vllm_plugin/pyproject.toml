[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qb-sm120-plugin"
version = "0.7.8"
description = "vLLM general plugin: SM120-safe replacement for block-FP8 (ue8m0) dense/attention GEMMs"

# vLLM calls every entry point in this group inside EVERY process it spawns (driver, EngineCore,
# TP/EP workers). This is the only monkeypatch mechanism that survives V1 process spawning.
[project.entry-points."vllm.general_plugins"]
qb_sm120 = "qb_sm120_plugin:install"

[tool.setuptools]
py-modules = ["qb_sm120_plugin", "moe_recon"]
