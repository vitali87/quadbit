[package]
name = "quadbit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[features]
default = []
cuda = ["cubecl/cuda"]
cpu = ["cubecl/cpu"]

[dependencies]
cubecl = "0.10.0"
half = "2.5"

# Patched C++ codegen: emit Blackwell-correct format-converting ldmatrix for FP4
# (m8n16 / m16n16.trans with .b8x16.b4x16_p64) instead of the rejected plain .b8.
[patch.crates-io]
cubecl-cpp = { path = "vendor/cubecl-cpp-0.10.0" }
