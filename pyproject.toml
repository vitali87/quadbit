[project]
name = "quadbit"
version = "0.1.0"
description = "4-bit (FP4) GPU kernels in Rust for the Blackwell gaps NVIDIA's libraries leave open (SM120/SM100)"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
